name: Cars CRUD Tests

# CI: runs the four test groups on pull requests and on pushes to main.
# CD: publishes the Docker image to Docker Hub only after the tests pass on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Install requirements-dev.txt
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium and its Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Run integration tests
        run: python -m pytest tests/integration -q

      - name: Run API tests
        run: python -m pytest tests/api -q

      - name: Run E2E tests
        run: python -m pytest tests/e2e -q

  publish:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: check out the code
        uses: actions/checkout@v7
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: authenticate to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: silvalbr/lesson-cars-crud:latest